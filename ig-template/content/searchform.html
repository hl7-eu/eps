<!DOCTYPE HTML>
<!-- Overrides the base template searchform.html, which is not well-formed XHTML -->
<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Search {{title}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="author" content="http://www.hl7.eu"/>

  <link href="fhir.css" rel="stylesheet"/>
  <link href="assets/css/bootstrap-fhir.css" rel="stylesheet"/>
  <link href="assets/css/project.css" rel="stylesheet"/>
  <link href="assets/css/hl7eu.css" rel="stylesheet"/>
  <link rel="shortcut icon" href="assets/ico/favicon.ico"/>
</head>

<body>
  <div id="segment-header" class="segment">  <!-- segment-header -->
    <div class="container">  <!-- container -->
      <div id="hl7-nav">
        <a id="family-logo" no-external="true" href="http://hl7.org/fhir"><img height="45" alt="FHIR" src="assets/images/fhir-logo-www.png"/></a>
        <a id="hl7-logo" no-external="true" href="https://hl7europe.org"><img height="50" alt="HL7 Europe website" src="assets/images/hl7-eu-logo.png"/></a>
      </div>
      <div id="ig-status" style="font-size:24px;padding-top: 20px;">
        <b id="ig-title">Search {{title}}</b>
      </div>
    </div>  <!-- /container -->
  </div>  <!-- /segment-header -->

  <div id="segment-content" class="segment">  <!-- segment-content -->
    <div class="container">  <!-- container -->
      <div class="row">
        <div class="inner-wrapper">
          <div class="col-12">
            <h2>Search {{title}}</h2>
            <iframe src="https://duckduckgo.com/search.html?site={{url}}&amp;prefill=Search {{title}}&amp;focus=yes" style="overflow:hidden;margin:0;padding:0;width:408px;height:40px;" frameborder="0"></iframe>
            <hr/>
            <p>Note: this form searches the current published version of {{title}}.</p>
            <p><a href="index.html">Back to the Implementation Guide</a></p>
          </div>
        </div>  <!-- /inner-wrapper -->
      </div>  <!-- /row -->
    </div>  <!-- /container -->
  </div>  <!-- /segment-content -->

  <div id="segment-footer" class="segment">  <!-- segment-footer -->
    <div class="container">  <!-- container -->
      <div class="inner-wrapper">
        <p>
          <span id="ig-footer">{{title}}</span> &copy; <a href="https://hl7europe.org">HL7 Europe</a> |
          <a rel="license" href="http://hl7.org/fhir/license.html">CC0</a>
        </p>
      </div>  <!-- /inner-wrapper -->
    </div>  <!-- /container -->
  </div>  <!-- /segment-footer -->
</body>
</html>
